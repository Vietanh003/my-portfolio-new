<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<style>
  /* ==========================================================
     Classic résumé — white, navy headings, serif.
     Variant 2: general profile — no projects; skills limited to
     AI, soft skills and office. Single-column, roomy spacing.
     ========================================================== */
  :root {
    --navy: #1b2a4a;
    --ink: #232323;
    --muted: #555;
    --rule: #cfd4dc;
    --serif: Georgia, "Times New Roman", Cambria, serif;
    --sans: Arial, "Helvetica Neue", Helvetica, sans-serif;
    --page: 210mm;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: #e9ecf1;
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--navy); }

  /* ===== Toolbar (screen only) ===== */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; background: rgba(27,42,74,0.96); flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    padding: 8px 15px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.35);
    background: transparent; color: #fff; text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn.primary, .btn.active { background: #fff; color: var(--navy); border-color: #fff; }
  .btn svg { width: 15px; height: 15px; }

  /* ===== The paper sheet ===== */
  .sheet {
    width: var(--page);
    max-width: 100%;
    margin: 22px auto;
    background: #fff;
    padding: 18mm 18mm;
    box-shadow: 0 10px 40px rgba(0,0,0,0.18);
  }

  /* ===== Masthead ===== */
  .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .masthead-left { flex: 1; min-width: 0; }

  .name {
    font-family: var(--serif);
    font-size: 33px; font-weight: 700; line-height: 1.05;
    letter-spacing: 0.5px; color: var(--navy);
    margin: 0 0 4px; text-transform: uppercase;
  }
  .role { font-size: 14.5px; font-style: italic; color: var(--ink); margin: 0 0 14px; }

  .contact { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 7px 22px; font-family: var(--sans); font-size: 12.5px; }
  .contact li { display: flex; align-items: center; gap: 9px; color: var(--ink); min-width: 0; }
  .contact li svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--navy); }
  .contact a, .contact span { color: var(--ink); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact a:hover { text-decoration: underline; }

  /* Portrait */
  .portrait {
    width: 112px; height: 140px; flex-shrink: 0;
    border: 1px solid var(--rule);
    background: repeating-linear-gradient(45deg, #f4f6f9, #f4f6f9 8px, #eef1f5 8px, #eef1f5 16px);
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: #9aa3b2; font-family: var(--sans); font-size: 10px; line-height: 1.4;
    border-radius: 2px; overflow: hidden;
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portrait span { padding: 6px; }

  /* ===== Section heading + rule ===== */
  .sec { margin-top: 22px; }
  .sec-title {
    font-family: var(--serif);
    font-size: 14px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--navy); margin: 0 0 3px;
  }
  .sec-rule { border: 0; border-top: 1px solid var(--rule); margin: 0 0 11px; }

  .para { font-family: var(--sans); font-size: 12.5px; line-height: 1.62; color: var(--ink); margin: 0; }

  /* ===== Rows (label left / content right) ===== */
  .row { display: grid; grid-template-columns: 176px 1fr; gap: 20px; padding: 3px 0; }
  .row + .row { border-top: 1px solid #eef0f4; margin-top: 4px; padding-top: 9px; }
  .row-label { font-family: var(--sans); font-size: 12px; color: var(--muted); padding-top: 2px; }
  .row-content { min-width: 0; }

  .entry-title { font-family: var(--serif); font-weight: 700; font-size: 14px; color: var(--navy); margin: 0; line-height: 1.25; }
  .entry-sub { font-family: var(--sans); font-size: 12.5px; font-style: italic; color: var(--ink); margin: 2px 0 6px; }

  .bullets { font-family: var(--sans); margin: 5px 0 0; padding-left: 17px; }
  .bullets li { font-size: 12.5px; line-height: 1.6; color: var(--ink); margin-bottom: 5px; padding-left: 2px; }
  .bullets li::marker { color: var(--navy); }

  /* ===== Skills ===== */
  .skill-row { display: grid; grid-template-columns: 176px 1fr; gap: 20px; padding: 5px 0; }
  .skill-row + .skill-row { border-top: 1px solid #eef0f4; }
  .skill-label { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--navy); padding-top: 1px; }
  .skill-body { font-family: var(--sans); font-size: 12.5px; line-height: 1.6; color: var(--ink); }

  .edu-title { font-family: var(--serif); font-weight: 700; font-size: 14px; color: var(--navy); margin: 0 0 2px; }
  .edu-major { font-family: var(--sans); font-size: 12.5px; color: var(--ink); margin: 2px 0 0; }

  /* ===== Responsive (screen) ===== */
  @media (max-width: 680px) {
    .sheet { padding: 24px 18px; margin: 12px auto; }
    .masthead { flex-direction: column-reverse; align-items: flex-start; }
    .portrait { width: 96px; height: 120px; }
    .name { font-size: 26px; }
    .contact { grid-template-columns: 1fr; }
    .row, .skill-row { grid-template-columns: 1fr; gap: 3px; }
    .row-label, .skill-label { padding-top: 0; font-weight: 700; }
  }

  /* ==========================================================
     PRINT — A4, single unbreakable page
     ========================================================== */
  @media print {
    @page { size: A4; margin: 12mm 14mm; }
    .no-print { display: none !important; }
    body { background: #fff !important; }
    .sheet { width: auto !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; break-inside: avoid; page-break-inside: avoid; }
    .row, .skill-row, .sec, .entry-title { break-inside: avoid; }
    a { color: #1b2a4a !important; }
  }
</style>
</head>

<script>

  /* ===== Bilingual content (general profile) ===== */

  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function apply(lang) {
    var d = I18N[lang] || I18N.en;
    document.documentElement.lang = lang;

    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute("data-i18n");
      if (typeof d[key] === "string") nodes[i].textContent = d[key];
    }

    var wrap = document.getElementById("skills");
    var html = "";
    for (var g = 0; g < d.skills.length; g++) {
      var grp = d.skills[g];
      html += '<div class="skill-row"><div class="skill-label">' + esc(grp.label) + '</div><div class="skill-body">' + esc(grp.body) + "</div></div>";
    }
    wrap.innerHTML = html;

    document.getElementById("lang-en").classList.toggle("active", lang === "en");
    document.getElementById("lang-vi").classList.toggle("active", lang === "vi");
    try { localStorage.setItem("cv2-lang", lang); } catch (e) {}
  }

  window.setLang = apply;
  var saved = "en";
  try { saved = localStorage.getItem("cv2-lang") || "en"; } catch (e) {}
  apply(saved);
